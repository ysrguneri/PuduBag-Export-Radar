<!doctype html>
<html lang="tr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>PuduBag Export Radar</title><link rel="stylesheet" href="assets/app.css?v=20260819-2"/></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">P</div><div><strong>PuduBag</strong><span>EXPORT RADAR</span></div></div><nav id="nav"><button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button><button class="nav-item" data-view="buyers">◎ <span>Alıcı Bul</span></button><button class="nav-item" data-view="exporters">↗ <span>Türk İhracatçılar</span></button><button class="nav-item" data-view="watchlist">★ <span>Takip Listesi</span></button><button class="nav-item" data-view="crm">▦ <span>Satış CRM</span></button><button class="nav-item" data-view="countries">◉ <span>Ülke Fırsatları</span></button><button class="nav-item" data-view="contacts">✉ <span>İletişim Merkezi</span></button><button class="nav-item" data-view="settings">⚙ <span>Veri Kaynakları</span></button></nav><div class="sidebar-footer"><div class="demo-pill">CANLI VERİ</div><small>ImportYeti gerçek veri araması aktif.</small></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">PUDUBAG INTERNATIONAL SALES INTELLIGENCE</div><h1 id="viewTitle">İhracat Dashboard</h1></div><div class="top-actions"><button class="ghost" id="exportCsvBtn">CSV Dışa Aktar</button><button class="primary" id="newBuyerSearchBtn">+ Yeni Alıcı Ara</button></div></header><section id="globalSearch" class="global-search"><div class="search-box"><span>⌕</span><input id="globalSearchInput" placeholder="Firma, ürün, ülke, HS kodu veya Türk ihracatçı ara…"/><button id="globalSearchBtn">Ara</button></div><div class="quick-filters"><button data-query="Türkiye'den alım yapan">Türkiye'den Alım Yapanlar</button><button data-query="Germany">Almanya</button><button data-query="Saudi Arabia">Suudi Arabistan</button><button data-query="tote bag">Tote Bag</button><button data-query="cosmetic bag">Cosmetic Bag</button></div></section><section id="view-dashboard" class="view active"></section><section id="view-buyers" class="view"></section><section id="view-exporters" class="view"></section><section id="view-watchlist" class="view"></section><section id="view-crm" class="view"></section><section id="view-countries" class="view"></section><section id="view-contacts" class="view"></section><section id="view-settings" class="view"></section></main></div><div id="modal" class="modal hidden" aria-hidden="true"><div class="modal-backdrop" data-close-modal></div><div class="modal-card"><button class="modal-close" data-close-modal>×</button><div id="modalContent"></div></div></div><script src="assets/config.js?v=20260819-2"></script><script src="assets/app.js?v=20260819-2"></script><script src="assets/live-search.js?v=20260819-2"></script><script>
function openLiveBuyerSearch(query){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view==='buyers'));const view=document.getElementById('view-buyers');if(view)view.classList.add('active');const title=document.getElementById('viewTitle');if(title)title.textContent='Alıcı Bul';if(typeof window.renderLiveBuyers==='function'){window.renderLiveBuyers();setTimeout(()=>{const input=document.getElementById('liveBuyerQuery');const btn=document.getElementById('liveBuyerSearch');if(input&&query)input.value=query;if(btn&&query)btn.click();else if(input)input.focus();},0)}}
document.addEventListener('click',function(e){const newBtn=e.target.closest('#newBuyerSearchBtn');if(newBtn){e.preventDefault();e.stopImmediatePropagation();openLiveBuyerSearch('');return}const searchBtn=e.target.closest('#globalSearchBtn');if(searchBtn){e.preventDefault();e.stopImmediatePropagation();const q=(document.getElementById('globalSearchInput')?.value||'').trim();if(q)openLiveBuyerSearch(q);else openLiveBuyerSearch('');return}const quick=e.target.closest('[data-query]');if(quick){e.preventDefault();e.stopImmediatePropagation();openLiveBuyerSearch(quick.dataset.query);}},true);
</script></body></html>
